<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laus Latina — Ecosistema de moda latinoamericana</title>
<meta name="description" content="Laus Latina es el ecosistema de moda latinoamericana que conecta creativos y brinda opinión fiable. Comunidad, visibilidad e identidad para quienes honran su origen.">

<!-- Google Fonts stand-ins for the brand typefaces (see README.md to swap for the real Cabinet Grotesk / Vesper Devanagari / Juana files) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">

<link rel="icon" href="assets/logo-mark-navy.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<!-- If JavaScript is unavailable, skip the scroll-reveal animation and just show everything -->
<noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
</head>
<body>

<!-- ============ SKIP LINK ============ -->
<a class="skip-link" href="#main">Saltar al contenido</a>

<!-- ============ HEADER ============ -->
<header class="site-header" id="top">
  <a href="#top" class="brand" aria-label="Laus Latina — inicio">
    <img src="assets/logo-lockup-cream.png" alt="Laus Latina" class="brand-lockup-img brand-lockup-light">
    <img src="assets/logo-lockup-navy.png" alt="Laus Latina" class="brand-lockup-img brand-lockup-dark">
  </a>
  <button type="button" class="btn btn-primary header-cta join-trigger" data-open-modal="joinModal">Escríbenos</button>
  <div class="wrap header-inner">
    <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Archivo</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="main-nav" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <h1 class="visually-hidden">Laus Latina — Ecosistema de moda latinoamericana</h1>

  <!-- ============ ORBIT SHOWCASE ============ -->
  <section class="orbit-showcase reveal">
    <div class="orbit-sticky">
      <img src="assets/logo-wordmark-outline-navy.png" alt="" class="orbit-wordmark" id="orbitWordmark">
      <div class="orbit-stage" id="orbitStage"></div>
      <div class="orbit-welcome" id="orbitWelcome" aria-hidden="true">
        <div class="orbit-welcome-row">
          <img src="assets/welcome-bienvenidos-al.png" alt="" class="orbit-welcome-static">
          <span class="orbit-welcome-archivo" id="orbitWelcomeArchivo">
            <img src="assets/welcome-archivo-serif.png" alt="" class="orbit-welcome-archivo-img is-active">
            <img src="assets/welcome-archivo-sans-thin.png" alt="" class="orbit-welcome-archivo-img">
            <img src="assets/welcome-archivo-sans-bold.png" alt="" class="orbit-welcome-archivo-img">
          </span>
        </div>
      </div>
      <div class="orbit-intro" id="orbitIntro" aria-hidden="true">
        <img src="assets/orbit-intro-content.png" alt="" class="orbit-intro-img">
      </div>
    </div>
  </section>

</main>

<!-- ============ JOIN MODAL ============ -->
<div class="modal-overlay" id="joinModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="joinModalTitle">
    <button type="button" class="modal-close" id="joinModalClose" aria-label="Cerrar">&times;</button>
    <div class="modal-media">
      <img src="assets/popweb-photo.jpg" alt="Si hay talento está en Laus. Fotografía por David Nieto, BFW26." class="modal-media-photo">
    </div>
    <div class="modal-body">
      <span class="modal-watermark modal-watermark-bottom" aria-hidden="true">Laus Latina</span>
      <div class="modal-body-content">
        <h3 id="joinModalTitle" class="modal-heading">
          <img src="assets/popweb-heading.png" alt="Bienvenidos al Archivo. Suscríbete al Newsletter de LAUS LATINA y descubre las voces y perspectivas que están transformando nuestra industria.">
        </h3>
        <form id="joinForm" novalidate>
          <div class="form-field">
            <label for="joinName">Nombre completo<span class="form-field-required">*</span></label>
            <input type="text" id="joinName" name="name" autocomplete="name" required>
          </div>
          <div class="form-field">
            <label for="joinEmail">Correo<span class="form-field-required">*</span></label>
            <input type="email" id="joinEmail" name="email" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="joinCity">Ciudad<span class="form-field-required">*</span></label>
            <input type="text" id="joinCity" name="city" autocomplete="address-level2" required>
          </div>
          <div class="form-field">
            <label for="joinPrefs">Preferencias de contenido</label>
            <input type="text" id="joinPrefs" name="preferencias" placeholder="¿Qué te gustaría ver en el Archivo?">
          </div>
          <label class="form-consent">
            <input type="checkbox" id="joinConsent" name="consent" required>
            <span>Autorizo el tratamiento de mis datos personales de acuerdo con la <a href="#" target="_blank" rel="noopener">Política de Privacidad</a> de LAUS LATINA.<span class="form-field-required">*</span></span>
          </label>
          <button type="submit" class="btn btn-primary modal-submit">Enviar</button>
          <p class="form-note" id="joinNote" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
